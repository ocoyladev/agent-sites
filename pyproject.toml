[project]
name = "agencia-web-ia"
version = "0.1.0"
description = "Motor de generacion automatizada de sitios web para negocios locales"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.27",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette.testclient prefiere httpx2, pero sigue funcionando con el httpx
    # que ya usa el cliente de Places. Agregar httpx2 solo para los tests no se
    # justifica todavia; revisar cuando starlette lo vuelva obligatorio.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true
